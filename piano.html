<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPP.Haunted | Neon Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg: #030008;
            --panel: rgba(10, 0, 20, 0.85);
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-purple: #9d00ff;
            --text: #e0e0e0;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(157, 0, 255, 0.15) 0%, transparent 50%);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 3px; }

        #sidebar {
            width: 300px; background: var(--panel); border-right: 2px solid var(--neon-blue);
            box-shadow: 2px 0 20px rgba(0, 243, 255, 0.15); display: flex; flex-direction: column; z-index: 10;
        }

        .header { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(0, 243, 255, 0.2); background: linear-gradient(180deg, rgba(255,0,234,0.1) 0%, transparent 100%); }
        .header h1 { font-size: 26px; font-weight: 900; color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); letter-spacing: 3px; }

        .section { padding: 20px; flex: 1; overflow-y: auto; border-bottom: 1px solid rgba(0, 243, 255, 0.2); }
        .section h3 { font-size: 14px; color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        
        ul { list-style: none; }
        li {
            padding: 10px 15px; margin-bottom: 8px; background: rgba(0, 243, 255, 0.05);
            border-left: 3px solid transparent; border-radius: 4px; display: flex;
            justify-content: space-between; align-items: center; font-size: 14px; transition: all 0.2s;
        }
        li:hover { background: rgba(0, 243, 255, 0.15); border-left-color: var(--neon-blue); cursor: pointer; transform: translateX(5px); }

        #main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #top-bar {
            height: 70px; background: var(--panel); border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 2px 20px rgba(255, 0, 234, 0.15); display: flex; align-items: center;
            justify-content: space-between; padding: 0 30px; z-index: 5;
        }
        #room-name { font-size: 24px; color: #fff; text-shadow: 0 0 10px #fff, 0 0 20px var(--neon-blue); }
        #status { font-size: 14px; color: var(--neon-pink); text-shadow: 0 0 5px var(--neon-pink); }

        #controls { padding: 15px 30px; background: rgba(0,0,0,0.4); display: flex; gap: 20px; align-items: center; border-bottom: 1px solid rgba(0, 243, 255, 0.1); }
        .btn {
            background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue);
            padding: 10px 20px; border-radius: 4px; cursor: pointer; font-family: 'Orbitron', sans-serif;
            font-weight: bold; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }

        #piano-container { flex: 1; display: flex; justify-content: center; align-items: flex-end; padding: 20px 30px 40px 30px; overflow-x: auto; }
        #piano { display: flex; position: relative; height: 280px; padding-bottom: 20px; }

        .white-key {
            width: 42px; height: 100%; background: #111; border: 1px solid var(--neon-blue);
            border-bottom: 5px solid #050008; border-radius: 0 0 6px 6px; margin: 0 1px;
            position: relative; z-index: 1; cursor: pointer; box-shadow: inset 0 -5px 15px rgba(0,0,0,0.8);
            transition: all 0.1s; display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 12px; color: rgba(255,255,255,0.2); font-size: 10px;
        }
        .white-key.active { background: var(--neon-blue); box-shadow: 0 0 30px var(--neon-blue); color: #000; transform: translateY(2px); border-bottom: 2px solid #050008; }

        .black-key {
            width: 26px; height: 60%; background: #000; border: 1px solid var(--neon-pink);
            border-bottom: 4px solid #050008; border-radius: 0 0 4px 4px; position: absolute;
            z-index: 2; cursor: pointer; box-shadow: 0 5px 10px rgba(0,0,0,0.9);
            transition: all 0.1s;
        }
        .black-key.active { background: var(--neon-pink); box-shadow: 0 0 30px var(--neon-pink); transform: translateY(2px); border-bottom: 2px solid #050008; }

        #chat-container { height: 220px; background: var(--panel); border-top: 1px solid rgba(0, 243, 255, 0.3); display: flex; flex-direction: column; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px 30px; font-family: 'Consolas', monospace; font-size: 14px; line-height: 1.5; }
        .msg { margin-bottom: 6px; }
        .msg-author { font-weight: bold; margin-right: 8px; text-shadow: 0 0 5px currentColor; }
        #chat-input-area { display: flex; padding: 15px 30px; background: rgba(0,0,0,0.6); }
        #chat-input {
            flex: 1; background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.3);
            color: #fff; padding: 12px 20px; font-family: 'Orbitron', sans-serif; outline: none; border-radius: 4px;
        }

        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 0, 8, 0.95); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: #000; border: 2px solid var(--neon-pink); box-shadow: 0 0 50px rgba(255, 0, 234, 0.4); padding: 50px; border-radius: 12px; text-align: center; width: 400px; }
        .modal-box h2 { color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue); margin-bottom: 30px; font-size: 28px; }
        .modal-box input { width: 100%; padding: 15px; margin-bottom: 20px; background: #050008; border: 1px solid var(--neon-blue); color: #fff; font-family: 'Orbitron', sans-serif; outline: none; text-align: center; font-size: 16px; }
        .modal-box button { width: 100%; padding: 15px; background: transparent; border: 2px solid var(--neon-pink); color: var(--neon-pink); font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .modal-box button:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 30px var(--neon-pink); }
    </style>
</head>
<body>

    <div id="modal">
        <div class="modal-box">
            <h2>СИСТЕМА ВХОДА</h2>
            <input type="text" id="username" placeholder="Твой позывной" maxlength="16">
            <input type="password" id="secretKey" placeholder="Код доступа (Admin)">
            <button onclick="connect()">ИНИЦИАЛИЗАЦИЯ</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="header"><h1>MPP.HAUNTED</h1></div>
        <div class="section">
            <h3>Субъекты в сети</h3>
            <ul id="player-list"></ul>
        </div>
    </div>

    <div id="main">
        <div id="top-bar">
            <div id="room-name">Lobby</div>
            <div id="status">ОЖИДАНИЕ ПОДКЛЮЧЕНИЯ</div>
        </div>

        <div id="controls" style="display: none;">
            <label for="midi-upload" class="btn">Загрузить MIDI</label>
            <input type="file" id="midi-upload" accept=".mid,.midi" style="display: none;" onchange="loadMidiFile(event)">
            <span id="midi-status" style="color: var(--neon-blue); font-size: 14px;">СИСТЕМА ГОТОВА</span>
        </div>

        <div id="piano-container">
            <div id="piano"></div>
        </div>

        <div id="chat-container">
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Введите сообщение..." onkeydown="handleChat(event)">
            </div>
        </div>
    </div>

    <script>
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const WS_URL = WS_PROTOCOL + window.location.host;
        
        let ws;
        let myName = "Аноним";
        let myId = null; // Сюда сервер запишет твой ID
        let myColor = "#00f3ff";
        let isOwner = false;
        let isMuted = false;

        // Генерируем ID для овнера (чтобы другие не могли зайти по ключу)
        let myClientId = localStorage.getItem('mpp_haunted_id');
        if (!myClientId) {
            myClientId = Math.random().toString(36).substring(2, 15);
            localStorage.setItem('mpp_haunted_id', myClientId);
        }

        // --- АУДИО ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const activeOscillators = {};

        function playSynth(midi, isRemote = false) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (activeOscillators[midi] && isRemote) return;
            
            const freq = 440 * Math.pow(2, (midi - 69) / 12);
            const osc = audioCtx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(freq + 2, audioCtx.currentTime);

            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.4, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

            osc.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc2.start(now); osc.stop(now + 2.5); osc2.stop(now + 2.5);
            
            activeOscillators[midi] = true;
            setTimeout(() => { delete activeOscillators[midi]; }, 150);
        }

        // --- ПИАНИНО ---
        const pianoEl = document.getElementById('piano');
        let whiteKeyCount = 0;
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        for (let midi = 21; midi <= 108; midi++) {
            const noteName = noteNames[midi % 12];
            const isSharp = noteName.includes('#');
            const key = document.createElement('div');
            key.dataset.midi = midi;
            
            if (isSharp) {
                key.className = 'black-key';
                let offset = 0;
                if (noteName === 'C#') offset = 30;
                if (noteName === 'D#') offset = 72;
                if (noteName === 'F#') offset = 156;
                if (noteName === 'G#') offset = 198;
                if (noteName === 'A#') offset = 240;
                key.style.left = `${(whiteKeyCount * 44) - 13 + offset}px`;
            } else {
                key.className = 'white-key';
                key.textContent = noteName + Math.floor(midi / 12 - 1);
                whiteKeyCount++;
            }
            
            key.addEventListener('mousedown', () => triggerNote(midi));
            key.addEventListener('mouseup', () => key.classList.remove('active'));
            key.addEventListener('mouseleave', () => key.classList.remove('active'));
            pianoEl.appendChild(key);
        }

        const keyMap = { 'a': 48, 'w': 49, 's': 50, 'e': 51, 'd': 52, 'f': 53, 't': 54, 'g': 55, 'y': 56, 'h': 57, 'u': 58, 'j': 59, 'k': 60, 'o': 61, 'l': 62, 'p': 63, ';': 64, "'": 65, 'z': 66, 'x': 67, 'c': 68, 'v': 69, 'b': 70, 'n': 71, 'm': 72 };

        document.addEventListener('keydown', (e) => {
            if (e.repeat || document.activeElement.tagName === 'INPUT') return;
            const midi = keyMap[e.key.toLowerCase()];
            if (midi) triggerNote(midi);
        });

        document.addEventListener('keyup', (e) => {
            const midi = keyMap[e.key.toLowerCase()];
            if (midi) {
                const keyEl = document.querySelector(`[data-midi="${midi}"]`);
                if (keyEl) keyEl.classList.remove('active');
            }
        });

        function triggerNote(midi) {
            if (isMuted) return;
            playSynth(midi);
            highlightKey(midi, myColor);
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: "noteOn", midi: midi }));
            }
        }

        function highlightKey(midi, color) {
            const keyEl = document.querySelector(`[data-midi="${midi}"]`);
            if (keyEl) {
                keyEl.classList.add('active');
                if (color !== myColor) {
                    keyEl.style.boxShadow = `0 0 30px ${color}`;
                    keyEl.style.background = color;
                    keyEl.style.borderColor = color;
                }
                setTimeout(() => {
                    keyEl.classList.remove('active');
                    keyEl.style.boxShadow = '';
                    keyEl.style.background = '';
                    keyEl.style.borderColor = '';
                }, 150);
            }
        }

        // --- СЕТЬ ---
        function connect() {
            myName = document.getElementById('username').value.trim() || "Аноним";
            const secretKey = document.getElementById('secretKey').value.trim() || null;
            const colors = ['#00f3ff', '#ff00ea', '#9d00ff', '#00ff66', '#ffaa00', '#ff3333'];
            myColor = colors[Math.floor(Math.random() * colors.length)];
            
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                document.getElementById('modal').style.display = 'none';
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('status').textContent = "ONLINE";
                
                ws.send(JSON.stringify({
                    type: "join", name: myName, color: myColor,
                    room: "Lobby", secretKey: secretKey, clientId: myClientId
                }));
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                switch (data.type) {
                    case "welcome":
                        myId = data.myId; // Сервер сказал, кто мы
                        isOwner = data.isOwner;
                        break;
                    case "playerList":
                        renderPlayers(data.players);
                        break;
                    case "notePlayed":
                        if (data.name !== myName) {
                            playSynth(data.midi, true);
                            highlightKey(data.midi, data.color);
                        }
                        break;
                    case "chatMessage":
                        addChat(data.name, data.text, data.color);
                        break;
                    case "kicked": alert("ТЕБЯ ВЫГНАЛИ!"); location.reload(); break;
                    case "banned": alert(`БАН. ПРИЧИНА: ${data.reason}`); location.reload(); break;
                    case "muted": isMuted = true; alert(`МУТ. ПРИЧИНА: ${data.reason}`); break;
                }
            };
        }

        function renderPlayers(players) {
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                li.innerHTML = `<span style="color:${p.color}; text-shadow: 0 0 5px ${p.color}">${p.name}</span> ${p.isOwner ? '👑' : ''}`;
                
                // Если это ТЫ
                if (p.id === myId) {
                    li.onclick = () => {
                        const newColor = prompt("Введи свой новый цвет (например, #ff0000):", p.color);
                        if (newColor && newColor.startsWith('#') && newColor.length === 7) {
                            ws.send(JSON.stringify({ type: "selfAction", action: "changeColor", newColor: newColor }));
                        }
                    };
                } 
                // Если ты админ и это ДРУГОЙ игрок
                else if (isOwner) {
                    li.onclick = () => {
                        const act = prompt(`АДМИН: ${p.name}\n1. Сменить цвет\n2. Сменить ник\n3. Кикнуть\n4. Забанить`);
                        if (act === '1') {
                            const c = prompt("Новый цвет (например, #ff0000):");
                            if (c && c.startsWith('#')) ws.send(JSON.stringify({ type: "adminAction", action: "changeColor", targetId: p.id, newColor: c }));
                        }
                        if (act === '2') {
                            const n = prompt("Новый ник:");
                            if (n) ws.send(JSON.stringify({ type: "adminAction", action: "changeName", targetId: p.id, newName: n }));
                        }
                        if (act === '3') ws.send(JSON.stringify({ type: "adminAction", action: "kick", targetId: p.id }));
                        if (act === '4') ws.send(JSON.stringify({ type: "adminAction", action: "ban", targetId: p.id, reason: "Нарушение", duration: 999999 }));
                    };
                }
                list.appendChild(li);
            });
        }

        function handleChat(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('chat-input');
                if (input.value.trim() === "" || isMuted) return;
                ws.send(JSON.stringify({ type: "chatMessage", text: input.value }));
                input.value = "";
            }
        }

        function addChat(author, text, color) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="msg-author" style="color:${color}">${author}:</span> <span>${text}</span>`;
            const chat = document.getElementById('chat-messages');
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function loadMidiFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const midi = new Midi(e.target.result);
                midi.tracks.forEach(track => {
                    track.notes.forEach(note => {
                        setTimeout(() => { triggerNote(note.midi); }, note.time * 1000);
                    });
                });
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
